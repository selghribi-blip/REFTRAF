name: Traffic Bot Runner

on:
  schedule:
    - cron: '0 */6 * * *'   # every 6 hours — human-like
  workflow_dispatch:
    inputs:
      target_url:
        description: 'Override target URL'
        required: false
        default: ''
      run_mode:
        description: 'Run mode'
        required: false
        default: 'local'
        type: choice
        options: [both, scrapy, browserstack, local, export]

permissions:
  actions: write
  contents: read

jobs:
  run-scrapy-spider:
    name: Scrapy
    if: |
      github.event_name == 'schedule' ||
      github.event.inputs.run_mode == 'both' ||
      github.event.inputs.run_mode == 'scrapy'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
      - name: Install Python deps
        run: |
          pip install --upgrade pip
          pip install --no-cache-dir 'Twisted==25.5.0' 'w3lib==2.3.1' 'PySocks>=1.7.1'
          pip install --no-cache-dir -r requirements.txt
      - name: Run Scrapy (fail-fast on log errors)
        env:
          MONGODB_URI: ${{ secrets.MONGODB_URI }}
          TARGET_URL: ${{ github.event.inputs.target_url || vars.TARGET_URL || 'https://www.forjo.tech/' }}
          MANUAL_PROXY_FILE: 'manual_proxies.txt'
          PROXY_HEALTHCHECK: 'true'
          DISABLE_PROXIES: 'false'
          FETCH_REMOTE_PROXIES: 'true'
        run: |
          set -o pipefail
          scrapy crawl traffic_bot \
            -a target_url="${TARGET_URL}" \
            -O scrapy_results.json \
            -L INFO 2>&1 | tee scrapy.log
          if grep -qE "Traceback|CRITICAL" scrapy.log; then
            echo "❌ Scrapy reported a fatal error"
            exit 1
          fi
          if [ ! -s scrapy_results.json ]; then
            echo "❌ No output produced"
            exit 1
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: scrapy-results
          path: scrapy_results.json
          if-no-files-found: ignore
          retention-days: 3

  run-local-browser-spider:
    name: Local Monetag-First
    if: |
      github.event_name == 'schedule' ||
      github.event.inputs.run_mode == 'both' ||
      github.event.inputs.run_mode == 'local'
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
      - name: Remove pre-installed Chrome
        run: |
          sudo apt-get remove -y google-chrome-stable 2>/dev/null || true
          sudo rm -f /usr/bin/google-chrome /usr/bin/google-chrome-stable
          sudo rm -f /usr/bin/chromedriver /usr/local/bin/chromedriver
          sudo rm -rf /opt/google/chrome
          echo "Old Chrome/ChromeDriver removed (if any)"
      - name: Setup Chrome with matching ChromeDriver
        id: setup-chrome
        uses: browser-actions/setup-chrome@v2
        with:
          chrome-version: 'stable'
          install-chromedriver: 'true'
          install-dependencies: 'true'
      - name: Verify versions match
        run: |
          set -e
          CHROME_PATH="${{ steps.setup-chrome.outputs.chrome-path }}"
          DRIVER_PATH=$(which chromedriver)
          CHROME_VERSION=$("$CHROME_PATH" --version | grep -oP '\d+\.\d+\.\d+\.\d+')
          DRIVER_VERSION=$("$DRIVER_PATH" --version | grep -oP '\d+\.\d+\.\d+\.\d+' | head -1)
          echo "Chrome: $CHROME_VERSION | Driver: $DRIVER_VERSION"
          CHROME_MAJOR=$(echo $CHROME_VERSION | cut -d. -f1)
          DRIVER_MAJOR=$(echo $DRIVER_VERSION | cut -d. -f1)
          if [ "$CHROME_MAJOR" != "$DRIVER_MAJOR" ]; then
            echo "❌ MISMATCH"
            exit 1
          fi
          echo "✅ Versions match"
          echo "CHROME_BIN=$CHROME_PATH" >> $GITHUB_ENV
          echo "CHROMEDRIVER_PATH=$DRIVER_PATH" >> $GITHUB_ENV
      - name: Install xvfb and system libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb libnss3 libgbm1
          sudo apt-get install -y libasound2t64 2>/dev/null || sudo apt-get install -y libasound2
      - name: Cache uc-chromedriver
        uses: actions/cache@v4
        with:
          path: ~/.local/share/undetected_chromedriver
          key: uc-chromedriver-${{ runner.os }}-${{ hashFiles('requirements.txt') }}
          restore-keys: |
            uc-chromedriver-${{ runner.os }}-
      - name: Install Python deps
        run: |
          pip install --upgrade pip
          pip install --no-cache-dir 'Twisted==25.5.0' 'w3lib==2.3.1' 'PySocks>=1.7.1'
          pip install --no-cache-dir -r requirements.txt
      - name: Run Local (Monetag-First)
        env:
          MONGODB_URI: ${{ secrets.MONGODB_URI }}
          TARGET_URL: ${{ github.event.inputs.target_url || vars.TARGET_URL || 'https://www.forjo.tech/' }}
          USE_PROXY_WITH_BROWSER: 'true'
          PROXY_HEALTHCHECK: 'true'
          MANUAL_PROXY_FILE: 'manual_proxies.txt'
          MAX_ADS_PER_SESSION: '3'
          MAX_PAGES_PER_SESSION: '3'
          DISPLAY_MODE: 'xvfb'
        run: |
          xvfb-run -a scrapy crawl browserstack_bot \
            -a target_url="${TARGET_URL}" \
            -a use_browserstack="false" \
            -O local_results.json \
            -L INFO
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: local-results
          path: local_results.json
          if-no-files-found: ignore
          retention-days: 3

  aggregate-results:
    name: Aggregate
    needs: [run-scrapy-spider, run-local-browser-spider]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Aggregate
        run: |
          echo "=== TRAFFIC BOT RUN SUMMARY ==="
          echo "Run: ${{ github.run_number }} | Trigger: ${{ github.event_name }}"
          total=$(python3 - <<'PYEOF'
          import json, glob
          total = 0
          for f in glob.glob('artifacts/**/*.json', recursive=True):
              try:
                  with open(f) as fh:
                      c = fh.read().strip()
                      if not c: continue
                      data = json.loads(c) if c.startswith('[') else [json.loads(l) for l in c.split('\n') if l.strip()]
                      total += len(data)
              except Exception:
                  pass
          print(total)
          PYEOF
          )
          echo "TOTAL ITEMS: $total"

  cleanup:
    name: Cleanup
    runs-on: ubuntu-latest
    if: always()
    steps:
      - uses: Mattraks/delete-workflow-runs@v2
        with:
          token: ${{ github.token }}
          repository: ${{ github.repository }}
          retain_days: 3
          keep_minimum_runs: 20
